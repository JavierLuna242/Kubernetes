# Endurecimiento de Apache para WordPress (se instala en conf-enabled; la aplicación no puede cambiarlo).

# No delatar versiones del servidor.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes
</Directory>

# XML-RPC: no se usa y permite probar cientos de contraseñas en una sola petición.
<Files xmlrpc.php>
    Require all denied
</Files>

# La biblioteca de medios es el único lugar con escritura: ahí nunca se ejecuta PHP.
<Directory /var/www/html/wp-content/uploads>
    php_admin_flag engine off
    <FilesMatch "\.(php|phar|phtml|php\d)$">
        Require all denied
    </FilesMatch>
</Directory>

# Cabeceras de seguridad. HSTS solo cuando la petición llegó por HTTPS (Cloudflare).
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
Header always set Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"
Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
