; Sobre php.ini-production: no delatar la versión de PHP ni mostrar errores en pantalla (van al log del pod).
expose_php = Off
display_errors = Off
log_errors = On
; Fotos de la biblioteca de medios.
upload_max_filesize = 16M
post_max_size = 20M
; Cookies de sesión de PHP (WordPress usa las suyas, esto cubre el resto).
session.cookie_httponly = 1
session.use_strict_mode = 1
