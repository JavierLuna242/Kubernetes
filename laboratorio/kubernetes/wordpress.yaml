# Sitio WordPress "Café Altura" + su propio MySQL, en el namespace wordpress.
# Contraseñas y claves: Secret "wordpress" (ver secretos.ejemplo.yaml).
# Público solo por Cloudflare Tunnel: https://wordpress.javier.life -> http://wordpress.wordpress.svc.cluster.local
# (ruta del túnel "Kubernetes" del proyecto). Ningún Service tiene IP pública.
apiVersion: v1
kind: Namespace
metadata:
  name: wordpress
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wordpress-db
  namespace: wordpress
spec:
  serviceName: wordpress-db
  replicas: 1
  selector:
    matchLabels:
      app: wordpress-db
  template:
    metadata:
      labels:
        app: wordpress-db
    spec:
      automountServiceAccountToken: false # no habla con la API de Kubernetes
      securityContext:
        runAsUser: 999 # mysql: dueño de los datos del disco; sin root ni capacidades
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mysql
          image: mysql:8.4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: wordpress
            - name: MYSQL_USER
              value: wordpress
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: wordpress, key: db-password }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: wordpress, key: db-root-password }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql # el disco de Azure trae lost+found en la raíz
          readinessProbe:
            tcpSocket: { port: 3306 }
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { memory: 768Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-db
  namespace: wordpress
spec:
  selector:
    app: wordpress-db
  ports:
    - port: 3306
---
# Biblioteca de medios (fotos que se suben desde el panel). Páginas, entradas y estilos viven en MySQL.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-medios
  namespace: wordpress
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 5Gi
---
# Imagen propia (laboratorio/wordpress): núcleo, tema y tipografías vienen en la imagen.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
spec:
  replicas: 1
  revisionHistoryLimit: 2 # versiones anteriores que se guardan para un rollback
  strategy:
    type: Recreate # el disco de medios es ReadWriteOnce: el pod viejo debe soltarlo antes
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      automountServiceAccountToken: false # no habla con la API de Kubernetes
      securityContext:
        fsGroup: 33 # www-data (Apache) puede escribir en el disco de medios
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: medios
          persistentVolumeClaim:
            claimName: wordpress-medios
      containers:
        - name: wordpress
          image: iotproyectojavierbr.azurecr.io/wordpress:latest
          imagePullPolicy: Always
          # Apache arranca como root solo para abrir el puerto 80 y pasar a www-data: no necesita más capacidades.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE, SETUID, SETGID, KILL]
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: wordpress-db
            - name: DB_NAME
              value: wordpress
            - name: DB_USER
              value: wordpress
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wordpress, key: db-password }
            - name: WP_SALT
              valueFrom:
                secretKeyRef: { name: wordpress, key: salt }
            - name: WP_URL
              value: https://wordpress.javier.life
          volumeMounts:
            - name: medios
              mountPath: /var/www/html/wp-content/uploads
            # La contraseña del panel no está en el pod: configurar-sitio la recibe por stdin al instalar (ver README).
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress
spec:
  selector:
    app: wordpress
  ports:
    - port: 80
---
# El backend de IoT Platform (cuenta de servicio iot/back) lee estos pods y su uso de CPU y memoria
# para mostrarlos en el visualizador como el dispositivo aks-wordpress (K8S_DEVICES en kubernetes/backend.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lector-iot-platform
  namespace: wordpress
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lector-iot-platform
  namespace: wordpress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lector-iot-platform
subjects:
  - kind: ServiceAccount
    name: back
    namespace: iot
