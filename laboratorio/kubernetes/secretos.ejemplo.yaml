# EJEMPLO: copiar a secretos.yaml (ignorado por git), cambiar cada valor y aplicar después de crear
# los namespaces wordpress y prestashop.
apiVersion: v1
kind: Secret
metadata:
  name: wordpress
  namespace: wordpress
stringData:
  db-password: CAMBIAR
  db-root-password: CAMBIAR
  salt: CAMBIAR # claves de las cookies de sesión (cualquier texto largo y aleatorio)
  admin-password: CAMBIAR # usuario admin del panel de WordPress
---
apiVersion: v1
kind: Secret
metadata:
  name: prestashop
  namespace: prestashop
stringData:
  db-password: CAMBIAR
  db-root-password: CAMBIAR
  admin-password: CAMBIAR # panel de PrestaShop (usuario admin@javier.life)
  admin-folder: CAMBIAR # carpeta del panel, p. ej. panel-x7k2m9q4 (minúsculas y números)
