# EJEMPLO: copiar a secretos.yaml (ignorado por git), cambiar cada valor y aplicar
# después de crear los namespaces. Usar solo letras y números: el script de
# PrestaShop pasa la contraseña a mysql sin comillas.
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-db
  namespace: wordpress
stringData:
  password: CAMBIAR
  root-password: CAMBIAR
---
apiVersion: v1
kind: Secret
metadata:
  name: prestashop-db
  namespace: prestashop
stringData:
  password: CAMBIAR
  root-password: CAMBIAR
  admin-password: CAMBIAR # login del back office de PrestaShop
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana
  namespace: monitoreo
stringData:
  admin-password: CAMBIAR
