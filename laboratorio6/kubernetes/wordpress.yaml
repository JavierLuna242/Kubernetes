# Sitio WordPress de IoT Platform + su propio MySQL, en el namespace wordpress.
# Contraseñas y claves: Secret "wordpress" (ver secretos.ejemplo.yaml).
# Público solo por Cloudflare Tunnel: https://wordpress.javier.life -> http://wordpress.wordpress.svc.cluster.local
# (ruta del túnel "Kubernetes" del proyecto). Ningún Service tiene IP pública.
apiVersion: v1
kind: Namespace
metadata:
  name: wordpress
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wordpress-db
  namespace: wordpress
spec:
  serviceName: wordpress-db
  replicas: 1
  selector:
    matchLabels:
      app: wordpress-db
  template:
    metadata:
      labels:
        app: wordpress-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: wordpress
            - name: MYSQL_USER
              value: wordpress
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: wordpress, key: db-password }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: wordpress, key: db-root-password }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql # el disco de Azure trae lost+found en la raíz
          readinessProbe:
            tcpSocket: { port: 3306 }
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { memory: 768Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-db
  namespace: wordpress
spec:
  selector:
    app: wordpress-db
  ports:
    - port: 3306
---
# Imagen propia (laboratorio6/wordpress). Las páginas y entradas viven en MySQL: el pod no necesita disco.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: iotproyectojavierbr.azurecr.io/wordpress:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: wordpress-db
            - name: DB_NAME
              value: wordpress
            - name: DB_USER
              value: wordpress
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wordpress, key: db-password }
            - name: WP_SALT
              valueFrom:
                secretKeyRef: { name: wordpress, key: salt }
            - name: WP_ADMIN_PASSWORD # solo la usa configurar-sitio en la instalación
              valueFrom:
                secretKeyRef: { name: wordpress, key: admin-password }
            - name: WP_URL
              value: https://wordpress.javier.life
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress
spec:
  selector:
    app: wordpress
  ports:
    - port: 80
---
# El backend de IoT Platform (cuenta de servicio iot/back) lee estos pods y su uso de CPU y memoria
# para mostrarlos en el visualizador como el dispositivo aks-wordpress (K8S_DEVICES en kubernetes/backend.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lector-iot-platform
  namespace: wordpress
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lector-iot-platform
  namespace: wordpress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lector-iot-platform
subjects:
  - kind: ServiceAccount
    name: back
    namespace: iot
