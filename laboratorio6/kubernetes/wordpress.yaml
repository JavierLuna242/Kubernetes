# Portal 1: WordPress + su propio MySQL, en el namespace wordpress.
# Las contraseñas vienen del Secret wordpress-db (ver secretos.ejemplo.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: wordpress
---
# MySQL solo para WordPress. Service ClusterIP: no sale a Internet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wordpress-db
  namespace: wordpress
spec:
  serviceName: wordpress-db
  replicas: 1
  selector:
    matchLabels:
      app: wordpress-db
  template:
    metadata:
      labels:
        app: wordpress-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: wordpress
            - name: MYSQL_USER
              value: wordpress
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: wordpress-db, key: password }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: wordpress-db, key: root-password }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql # el disco de Azure trae lost+found en la raíz
          readinessProbe:
            tcpSocket: { port: 3306 }
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { memory: 768Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-db
  namespace: wordpress
spec:
  selector:
    app: wordpress-db
  ports:
    - port: 3306
---
# Las páginas viven en MySQL, así que el pod de WordPress puede reiniciarse sin disco propio.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: wordpress:6.8-apache
          ports:
            - containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: wordpress-db
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wordpress-db, key: password }
          readinessProbe:
            tcpSocket: { port: 80 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
# Comparte la IP pública del proyecto (iot-ip) en otro puerto: no se paga una IP más.
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress
  annotations:
    service.beta.kubernetes.io/azure-pip-name: iot-ip
spec:
  type: LoadBalancer
  selector:
    app: wordpress
  ports:
    - port: 8080
      targetPort: 80
