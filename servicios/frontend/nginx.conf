server {
    listen 80;
    root /usr/share/nginx/html;

    # Análisis (Service "analysis"): solo con sesión válida, que nginx comprueba preguntándole al back.
    location /api/analysis {
        auth_request /_auth;
        proxy_pass http://analysis:8000;
        client_max_body_size 5m;
    }

    location = /_auth {
        internal;
        proxy_pass http://back:8000/api/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # API y WebSocket al back (Service "back" del clúster).
    location /api/ {
        proxy_pass http://back:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_read_timeout 1h; # el WebSocket queda abierto
    }

    # MQTT sobre WebSocket para los dispositivos (wss://iot.javier.life/mqtt) -> broker EMQX.
    # Sin sesión de la web: el broker exige su propio usuario y contraseña MQTT.
    location = /mqtt {
        proxy_pass http://broker-ws:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h; # conexiones de dispositivos de larga duración
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
