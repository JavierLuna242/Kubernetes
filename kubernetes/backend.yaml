# Back (FastAPI). Solo dentro del clúster: el front le llega por el proxy de nginx en /api.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: back
  namespace: iot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  namespace: iot
spec:
  replicas: 1 # ponytail: 1 réplica; con más, cada una recibiría y guardaría el mismo mensaje MQTT (usar shared subscription $share/...)
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      serviceAccountName: back # lee pods de los namespaces de K8S_DEVICES (permiso en cada namespace)
      containers:
        - name: back
          image: iotproyectojavierbr.azurecr.io/back:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iot-secrets
                  key: db-password
            - name: DATABASE_URL
              value: postgresql://iot:$(DB_PASSWORD)@database:5432/iot
            - name: MQTT_HOST
              value: broker
            - name: MQTT_USER
              value: iot
            - name: MQTT_PUBLIC_WSS # cómo se conectan los dispositivos desde internet (se muestra en la web)
              value: wss://iot.javier.life/mqtt
            - name: MQTT_PUBLIC_TCP
              value: 57.156.67.235:1883
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iot-secrets
                  key: mqtt-password
            - name: APP_USER
              value: admin
            - name: APP_PASSWORD # login del visualizador
              valueFrom:
                secretKeyRef:
                  name: iot-secrets
                  key: app-password
            - name: SESSION_SECRET # firma de las cookies de sesión
              valueFrom:
                secretKeyRef:
                  name: iot-secrets
                  key: session-secret
            - name: K8S_DEVICES # namespace=dispositivo: sus pods se ven como lecturas (Laboratorio)
              value: wordpress=aks-wordpress,prestashop=aks-prestashop
            - name: AZURE_SUBSCRIPTION # coste del mes por Telegram (cost_loop)
              value: 5a64ca6a-f2b7-410c-89d2-7e1464c2e7d0
            - name: AZURE_CLIENT_ID # identidad de los nodos (Proyecto-agentpool), con rol Cost Management Reader
              value: 7ceea717-0967-4e23-8689-acf4db690ae5
            - name: EMQX_API
              value: http://broker-ws:18083
            - name: EMQX_API_KEY # "clave:secreto" de la API del broker (estado de conexión de los dispositivos)
              valueFrom:
                secretKeyRef:
                  name: iot-secrets
                  key: emqx-api-key
            - name: TELEGRAM_TOKEN # opcional: avisos de alertas (Secret "telegram", ver README)
              valueFrom:
                secretKeyRef:
                  name: telegram
                  key: token
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram
                  key: chat-id
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: back
  namespace: iot
spec:
  selector:
    app: back
  ports:
    - port: 8000
